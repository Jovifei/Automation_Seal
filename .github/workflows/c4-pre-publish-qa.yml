name: C4 Pre-Publish QA

on:
  pull_request:
    paths:
      - 'reference/commerce/c4/**'
      - 'scripts/commerce/c4_*'
      - 'docs/commerce/C4_*'
      - 'docs/commerce/C3_RUNTIME_REMOTE_RECONCILIATION_20260905.md'
      - 'prompts/commerce/LOCAL_CODEX_C4_*'
      - '.github/workflows/c4-pre-publish-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c4-pre-publish-reference-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Python version
        run: python3 --version

      - name: Compile C4 verification tools
        run: |
          python3 -m py_compile scripts/commerce/c4_verify_pre_publish_readiness.py
          python3 -m py_compile scripts/commerce/c4_verify_pre_publish_readiness_selftest.py

      - name: Parse C4 acceptance contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('reference/commerce/c4/C4_PRE_PUBLISH_ACCEPTANCE_CONTRACT.json')
          contract = json.loads(p.read_text(encoding='utf-8'))
          assert contract['success_stop'] == 'C4_PRE_PUBLISH_QA_READY_FOR_HUMAN_DECISION'
          assert contract['human_decision_state_required'] == 'issued_from_human=false'
          assert len(contract['required_gates']) >= 15
          assert len(contract['real_action_flags']) == 6
          print('C4_PRE_PUBLISH_CONTRACT_PASS')
          PY

      - name: Run C4 readiness verifier self-test
        run: |
          python3 scripts/commerce/c4_verify_pre_publish_readiness_selftest.py \
            scripts/commerce/c4_verify_pre_publish_readiness.py \
            reference/commerce/c4/C4_PRE_PUBLISH_ACCEPTANCE_CONTRACT.json

      - name: Guard Human Decision candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('docs/commerce/C4_HUMAN_PILOT_DECISION_CANDIDATE_V1.md').read_text(encoding='utf-8')
          assert '**issued_from_human：** `false`' in text, 'C4 decision candidate must remain unsigned'
          assert 'C3_RUNTIME_GIT_RECONCILIATION_PASS' in text, 'missing runtime Git reconciliation gate'
          assert 'C4_PRE_PUBLISH_QA_READY_FOR_HUMAN_DECISION' in text, 'missing pre-publish terminal state'
          print('C4_HUMAN_GATE_GUARD_PASS')
          PY

      - name: Guard C4 draft publishing boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('docs/commerce/C4_PILOT_OPERATIONAL_KIT_V1.md').read_text(encoding='utf-8')
          assert 'DO_NOT_PUBLISH_AS_IS' in text
          assert '真实 Pilot 尚未发生' in text
          print('C4_DRAFT_BOUNDARY_PASS')
          PY
