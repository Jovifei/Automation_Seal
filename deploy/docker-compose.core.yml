name: jovi-automation

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: jovi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [jovi_internal]

  n8n:
    image: ${N8N_IMAGE}
    container_name: jovi-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_PORT}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${N8N_PORT}/
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../data/n8n-files:/files
      - ../workspace/review-queue:/review-queue
      - ../workspace/approved:/approved:ro
      - ../workspace/quarantine:/quarantine
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:5678/healthz')
          .then(r=>process.exit(r.ok?0:1))
          .catch(()=>process.exit(1))
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 45s
    networks: [jovi_internal]

  changedetection:
    image: ${CHANGEDETECTION_IMAGE}
    container_name: jovi-changedetection
    profiles: ["research"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHANGEDETECTION_PORT}:5000"
    environment:
      TZ: ${TZ}
      BASE_URL: http://localhost:${CHANGEDETECTION_PORT}
      HIDE_REFERER: "true"
    volumes:
      - ../data/changedetection:/datastore
    networks: [jovi_internal]

  redis:
    image: ${REDIS_IMAGE}
    container_name: jovi-redis
    profiles: ["scale"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [jovi_internal]

networks:
  jovi_internal:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  redis_data:
